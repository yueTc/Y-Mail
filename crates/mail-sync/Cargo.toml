[package]
name = "mail-sync"
description = "设置同步底座：口令派生、加解密、出网包格式、GitHub 接口与 Gist 读写。"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
mail-domain.workspace = true
mail-net.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
zeroize.workspace = true
base64.workspace = true
getrandom = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt"] }
url = "2"

[dev-dependencies]
tokio = { version = "1.44", features = ["net", "io-util", "time", "macros", "rt", "rt-multi-thread"] }