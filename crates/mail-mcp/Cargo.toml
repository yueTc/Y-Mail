[package]
name = "mail-mcp"
description = "MCP（Model Context Protocol）stdio 服务端：把本机邮件只读地暴露给外部 Agent；默认关闭。"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "ymail-mcp"
path = "src/main.rs"

[dependencies]
mail-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile.workspace = true
mail-domain.workspace = true
mail-store.workspace = true
