# 发布：推送 v* 标签（例如 v0.1.3）时，在 Windows 上打安装包、签名，并上传更新清单 latest.json。
#
# 仓库 Secrets 里要有两个值（私钥绝不入库，见 AGENTS.md 安全铁律）：
#   TAURI_SIGNING_PRIVATE_KEY          ：更新签名私钥的内容（或它在构建机上的路径）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD ：生成私钥时设的密码；没设密码就留空字符串
#
# 发布先落成草稿，由人检查后再点发布；只有正式发布的 Release 才会被
# releases/latest/download/latest.json 这个更新源看到。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装前端依赖
        run: npm ci

      # externalBin 不入库，打包前必须先编译出 MCP 附属程序，否则会打包失败。
      - name: 构建 MCP 附属程序
        run: node scripts/build-mcp-sidecar.mjs

      - name: 构建、签名并上传安装包与更新清单
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Y-Mail ${{ github.ref_name }}
          releaseBody: Windows 安装包与自动更新清单见下方资产。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true