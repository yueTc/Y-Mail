# 持续集成：Windows 上跑格式、静态检查、测试与前端构建。
# 说明：不使用任何 secrets，不访问私有资源；缓存只作用于公开依赖。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: 格式 / 静态检查 / Rust 测试 / 前端构建与测试
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 运行前端测试
        run: npm test

      - name: 检查格式
        run: cargo fmt --all --check

      - name: 静态检查（clippy 视为错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 运行测试
        run: cargo test --workspace